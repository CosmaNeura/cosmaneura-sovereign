<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sovereign panel — named beta</title>
<style>
  :root{color-scheme:light;--page:#f4f7fa;--card:#fff;--line:#dbe3eb;
    --ink:#142033;--muted:#5d6d80;--navy:#152744;--gold:#b88b2e}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;
    background:var(--page);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(600px,100%);padding:36px;border:1px solid var(--line);
    border-radius:16px;background:var(--card);box-shadow:0 16px 42px rgba(21,39,68,.1)}
  .label{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase}
  h1{margin:.35em 0;color:var(--navy);font-size:clamp(28px,6vw,42px);line-height:1.15}
  p{margin:.8em 0;color:var(--muted)}
  .boundary{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="label">Sovereign named beta</div>
    <h1 id="title">The provider panel is unavailable.</h1>
    <p>Only a signed-in provider named for this pilot may open the assistant
      through the approved private host.</p>
    <p class="boundary">This preview contains no clinical records and accepts no
      clinical input. Merging code does not publish or deploy the panel.</p>
  </main>
</body>
</html>
