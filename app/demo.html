<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sovereign named beta</title>
<style>
  :root{color-scheme:dark;--bg:#0f1620;--card:#16202c;--line:#27384a;
    --ink:#eaf1f8;--muted:#a9b8c8;--accent:#d6ae55}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(900px 500px at 50% 0,#1d2a38,var(--bg));
    color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(560px,100%);padding:34px;border:1px solid var(--line);
    border-radius:18px;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .label{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase}
  h1{margin:.35em 0;font-size:clamp(28px,6vw,42px);line-height:1.15}
  p{margin:.8em 0;color:var(--muted)}
  .boundary{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="label">Sovereign named beta</div>
    <h1 id="title">The assistant is unavailable here.</h1>
    <p>Access is limited to approved providers through the private pilot host.</p>
    <p class="boundary">This page does not accept health, visit, or account information.
      Sovereign has no production deployment.</p>
  </main>
</body>
</html>
