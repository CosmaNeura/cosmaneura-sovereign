name: Prepare provider production artifact

# Artifact preparation/provenance selection only. No app, config or activation
# mutation. The legacy dual producer/deployer remains disabled and unchanged.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, select]
        default: prepare
        required: true
      producer_run_id:
        type: string
        description: Completed prepare run ID (select mode only)
      producer_attempt:
        type: string
        description: Exact completed producer attempt (select mode only)
      artifact_id:
        type: string
        description: Immutable candidate artifact ID (select mode only)

permissions:
  contents: read

concurrency:
  group: provider-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize provider artifact preparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require founder manual dispatch and exact clean current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 -B tools/production_provider_candidate.py context

  test:
    name: Provider artifact quality & tests
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify dependency locks are current
        run: tools/compile_requirements_locks.sh --check
      - name: Install deps
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv \
            --require-hashes --only-binary=:all: \
            -r requirements.lock -r requirements-ci.lock
          uv pip check --python .venv
      - name: Ruff
        run: .venv/bin/ruff check .
      # Runs offline in mock mode -- no API keys required.
      - name: Pytest
        run: PYTHONPATH=. .venv/bin/python -m pytest tests/ -q
      - name: Compile Python
        run: .venv/bin/python -m compileall -q app tests tools run_demo.py
      - name: Check JavaScript syntax
        run: |
          node --check app/panel.js
          for html in app/demo.html app/demo_dashboard.html; do
            output="/tmp/$(basename "$html" .html).js"
            awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside{print}' \
              "$html" > "$output"
            node --check "$output"
          done
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infra tools -type f -name '*.sh' -print0)

  infrastructure:
    name: Provider artifact infrastructure
    needs: authorize
    runs-on: ubuntu-latest
    env:
      # CI validates production configuration explicitly; the Terraform root
      # itself has no default deployment boundary.
      TF_VAR_deployment_environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5
      - name: Format
        run: tofu -chdir=infra fmt -check -recursive
      - name: Initialize from committed provider lock
        run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - name: Validate
        run: tofu -chdir=infra validate

  prepare:
    name: Prepare provider candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [authorize, test, infrastructure]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'CosmaNeura/cosmaneura-sovereign' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'JohnClem' && github.triggering_actor == 'JohnClem' &&
        inputs.mode == 'prepare' &&
        vars.SOVEREIGN_PROVIDER_ARTIFACT_PREPARATION_ENABLED == 'true' &&
        needs.authorize.result == 'success' &&
        needs.test.result == 'success' && needs.infrastructure.result == 'success'
      }}
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROVIDER_ARTIFACT_PREPARATION_ENABLED: ${{ vars.SOVEREIGN_PROVIDER_ARTIFACT_PREPARATION_ENABLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build isolated hash-locked provider image before Azure credentials
        run: PYTHONPATH=. python3 -B tools/production_provider_candidate.py build
      - name: Recheck current main before registry credentials
        run: PYTHONPATH=. python3 -B tools/production_provider_candidate.py context
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_PROVIDER_ARTIFACT_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate only the fixed provider production registry
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -B tools/production_provider_candidate.py context
          az acr login --name cosmaneurasovereignprodregistry --output none
      - name: Publish, lock and read back candidate tag plus digest manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-candidate"
          PYTHONPATH=. python3 -B tools/production_provider_candidate.py publish \
            --output "$RUNNER_TEMP/provider-candidate/candidate.json"
      - name: Store immutable candidate descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-production-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/provider-candidate/candidate.json
          if-no-files-found: error
          retention-days: 30

  select:
    name: Select provider candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [authorize, test, infrastructure]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'CosmaNeura/cosmaneura-sovereign' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'JohnClem' && github.triggering_actor == 'JohnClem' &&
        inputs.mode == 'select' && needs.authorize.result == 'success' &&
        needs.test.result == 'success' && needs.infrastructure.result == 'success'
      }}
    # Read-only authenticated GitHub metadata/archive; no Azure identity or app.
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select only an authenticated completed current-source producer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-selection"
          PYTHONPATH=. python3 -B tools/production_provider_candidate.py select \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-attempt "$PRODUCER_ATTEMPT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --output "$RUNNER_TEMP/provider-selection/selection.json"
      - name: Store provenance-only selection receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-provenance-selection-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/provider-selection/selection.json
          if-no-files-found: error
          retention-days: 30
