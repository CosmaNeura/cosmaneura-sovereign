name: Build & Publish

# Self-contained CI for the Sovereign microservice. Unlike the main app there
# is no frontend, no database migrations, and no build-time secrets (the service
# reads all config from env at runtime; Container App secrets are set by
# Terraform, not here). So CI is just: test -> build image -> push -> deploy.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a main-branch run between the two mount updates. Pull
  # requests are cheap enough to finish rather than sharing cancellation policy
  # with the safety-critical deployment job.
  cancel-in-progress: false

jobs:
  test:
    name: Quality & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify dependency locks are current
        run: tools/compile_requirements_locks.sh --check
      - name: Install deps
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv \
            --require-hashes --only-binary=:all: \
            -r requirements.lock -r requirements-ci.lock
          uv pip check --python .venv
      - name: Ruff
        run: .venv/bin/ruff check .
      # Runs offline in mock mode -- no API keys required.
      - name: Pytest
        run: PYTHONPATH=. .venv/bin/python -m pytest tests/ -q
      - name: Compile Python
        run: .venv/bin/python -m compileall -q app tests tools run_demo.py
      - name: Check JavaScript syntax
        run: |
          node --check app/panel.js
          for html in app/demo.html app/demo_dashboard.html; do
            output="/tmp/$(basename "$html" .html).js"
            awk '/<script>/{inside=1; next} /<\/script>/{inside=0} inside{print}' \
              "$html" > "$output"
            node --check "$output"
          done
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infra tools -type f -name '*.sh' -print0)

  infrastructure:
    name: OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5
      - name: Format
        run: tofu -chdir=infra fmt -check -recursive
      - name: Initialize from committed provider lock
        run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - name: Validate
        run: tofu -chdir=infra validate

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    # Four revision transitions plus bounded forward/rollback smoke loops can
    # legitimately exceed 20 minutes. Leave enough runway for the EXIT trap to
    # restore both mounts rather than letting the runner kill it mid-rollback.
    timeout-minutes: 60
    needs: [test, infrastructure]
    # Default-off kill switch. Do not enable until the external deployment,
    # governance, secrets, dual-app, smoke, and rollback gates are cleared.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.SOVEREIGN_DEPLOY_ENABLED == 'true' }}
    environment: production
    permissions:
      contents: read
      id-token: write # required for Azure OIDC federation (no stored creds)
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'cosmaneura-sovereign-prod' }}
      PROVIDER_APP: ${{ vars.AZURE_PROVIDER_CONTAINER_APP || 'cosmaneura-sovereign-prod-app' }}
      PUBLIC_APP: ${{ vars.AZURE_PUBLIC_CONTAINER_APP || 'cosmaneura-web-prod-app' }}
      REGISTRY: ${{ vars.CONTAINER_REGISTRY_HOST }} # e.g. cosmaneurasovereignprodregistry.azurecr.io
      IMAGE_REPO: cosmaneura/sovereign
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install locked smoke dependencies
        run: |
          uv venv --python 3.13 .deploy-venv
          uv pip install --python .deploy-venv \
            --require-hashes --only-binary=:all: \
            -r requirements.lock
          uv pip check --python .deploy-venv

      - name: Install Nixpacks 1.41.0
        run: |
          archive="$RUNNER_TEMP/nixpacks-v1.41.0.tar.gz"
          install_dir="$RUNNER_TEMP/nixpacks-v1.41.0"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/railwayapp/nixpacks/releases/download/v1.41.0/nixpacks-v1.41.0-x86_64-unknown-linux-gnu.tar.gz
          echo "194bcad8c379f78a309eee1a88b2e6b2abc59f354efe7ecd7b4bbaf21de99a06  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/nixpacks" --version

      # OIDC login — uses the federated identity created in infra/main.tf.
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Build & push image
        run: |
          IMAGE="$REGISTRY/$IMAGE_REPO"
          SHA="${{ github.sha }}"
          nixpacks build . \
            --name "$IMAGE:$SHA" \
            --platform linux/amd64 \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}"
          docker push "$IMAGE:$SHA"

          DIGEST="$(az acr manifest show-metadata \
            --registry "${REGISTRY%%.*}" \
            --name "$IMAGE_REPO:$SHA" \
            --query digest --output tsv)"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ACR did not return an immutable image digest" >&2
            exit 1
          fi
          echo "IMAGE_REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"

      - name: Deploy both mounts with paired rollback
        env:
          REVISION_SUFFIX: r-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_PYTHON: .deploy-venv/bin/python
          SOVEREIGN_SYNTHETIC_RECORD_CONFIRMED: ${{ vars.SOVEREIGN_SYNTHETIC_RECORD_CONFIRMED }}
          # Intentionally no Clerk JWTs or record grant here: all are
          # short-lived and must never be persisted as workflow secrets. This
          # default-off job cannot deploy until a reviewed smoke-time mint
          # exchange is added.
          SOVEREIGN_INTERACTIVE_SMOKE_CREDENTIALS: "false"
        run: |
          infra/scripts/deploy-dual.sh
